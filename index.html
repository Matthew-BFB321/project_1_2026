<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sales Dashboard</h1>
  </header>

  <main class="dashboard">
    <div class="card">
      <div class="icon">💰</div>
      <h2>Total Sales</h2>
      <p class="metric">R 120,000</p>
      <span class="trend up">▲ 12% vs last month</span>
    </div>

    <div class="card">
      <div class="icon">👥</div>
      <h2>New Customers</h2>
      <p class="metric">45</p>
      <span class="trend up">▲ 8% vs last month</span>
    </div>

    <div class="card">
      <div class="icon">📦</div>
      <h2>Orders This Month</h2>
      <p class="metric">312</p>
      <span class="trend down">▼ 3% vs last month</span>
    </div>
  </main>
</body>
</html>
